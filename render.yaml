services:
  - type: web
    name: maqola-generator
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NCBI_EMAIL
        sync: false
      - key: GPT_MODEL
        value: gpt-4o
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
