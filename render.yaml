services:
  - type: web
    name: maqola-generator
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NCBI_EMAIL
        sync: false
      # DIQQAT: bu qiymatlarni eski modelga qaytarmang.
      # gemini-2.0-flash 2026-06-01 da o'chirilgan (404 beradi).
      # gpt-4o yangi GPT-5.x kabi ishlamaydi va eski parametrlarni talab qiladi.
      - key: GPT_MODEL
        value: gpt-5.6-luna
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
